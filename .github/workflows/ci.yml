name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/mcp-server/package-lock.json
            packages/mcp-user-server/package-lock.json
      - run: npm install --prefix packages/mcp-server
      - run: npm install --prefix packages/mcp-user-server
      - run: npm test
      - run: npm run build
      - run: npm run validate
